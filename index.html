<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Bush Pilot — MVP</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b1020; color: #fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }

    /* Touch UI */
    .touch-ui{
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: none;
    }
    .touch-left, .touch-right{
      position: absolute;
      bottom: 16px;
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }
    .touch-left{ left: 16px; }
    .touch-right{ right: 16px; flex-direction: column; }

    .btn{
      width: 72px;
      height: 72px;
      border-radius: 18px;
      border: 2px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.10);
      color: rgba(255,255,255,0.92);
      font-size: 28px;
      font-weight: 700;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .btn:active{ background: rgba(255,255,255,0.18); }
    .btn.throttle{
      width: 160px;
      font-size: 16px;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="touchUI" class="touch-ui" aria-hidden="true">
    <!-- LEFT: throttle -->
    <div class="touch-left">
      <button class="btn throttle" data-touch="throttle">THROTTLE</button>
    </div>

    <!-- RIGHT: pitch -->
    <div class="touch-right">
      <button class="btn" data-touch="pitchUp">▲</button>
      <button class="btn" data-touch="pitchDown">▼</button>
    </div>
  </div>

<script>
(() => {
  // ---------- Canvas ----------
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");

  function resize() {
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.width  = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // draw in CSS pixels
  }
  window.addEventListener("resize", resize);
  resize();

  const W = () => window.innerWidth;
  const H = () => window.innerHeight;

  // ---------- Simple deterministic PRNG + smooth noise ----------
  function makeRng(seed) {
    let t = seed >>> 0;
    return () => {
      // xorshift32
      t ^= t << 13; t >>>= 0;
      t ^= t >> 17; t >>>= 0;
      t ^= t << 5;  t >>>= 0;
      return (t >>> 0) / 4294967296;
    };
  }
  const rng = makeRng(1337);

  function smoothstep(t) { return t * t * (3 - 2 * t); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  // ---------- Terrain (heightmap) ----------
  const terrain = {
    // We keep a flat runway region at the start, then gentle random hills
    baseY: 420,
    stepX: 90,          // spacing between control points
    amp: 120,           // hill amplitude
    maxSlopePerStep: 55,// clamp sudden jumps
    flatUntilX: 700,    // runway length
    points: [],         // {x,y}
  };

  function ensureTerrainToX(xMax) {
    // generate points until we cover xMax + margin
    const margin = 1400;
    const target = xMax + margin;

    if (terrain.points.length === 0) {
      terrain.points.push({ x: 0, y: terrain.baseY });
      terrain.points.push({ x: terrain.stepX, y: terrain.baseY });
    }

    while (terrain.points[terrain.points.length - 1].x < target) {
      const last = terrain.points[terrain.points.length - 1];
      const x = last.x + terrain.stepX;

      let y;
      if (x <= terrain.flatUntilX) {
        y = terrain.baseY; // runway flat
      } else {
        // Gentle wandering: add a bounded random delta
        const r = (rng() * 2 - 1); // -1..1
        const delta = r * terrain.maxSlopePerStep;
        y = last.y + delta;

        // Pull towards base + noise band so it doesn't drift off-screen forever
        const bandCenter = terrain.baseY + (rng() * 2 - 1) * (terrain.amp * 0.15);
        y = lerp(y, bandCenter, 0.08);

        // Clamp overall amplitude
        const minY = terrain.baseY - terrain.amp;
        const maxY = terrain.baseY + terrain.amp;
        y = Math.max(minY, Math.min(maxY, y));
      }

      terrain.points.push({ x, y });
    }
  }

  function groundYAt(x) {
    // find segment
    if (terrain.points.length < 2) return terrain.baseY;
    if (x <= terrain.points[0].x) return terrain.points[0].y;

    // ensure points exist ahead
    ensureTerrainToX(x);

    // binary-ish scan (small list, linear is fine)
    let i = 0;
    while (i < terrain.points.length - 2 && terrain.points[i + 1].x < x) i++;

    const p0 = terrain.points[i];
    const p1 = terrain.points[i + 1];

    const t = (x - p0.x) / (p1.x - p0.x);
    const s = smoothstep(Math.max(0, Math.min(1, t)));
    return lerp(p0.y, p1.y, s);
  }

  // ---------- World ----------
  const world = {
    gravity: 900, // px/s^2
  };

  // ---------- Scoring + Gates ----------
  const score = {
    points: 0,
    combo: 0,
    mult: 1,
    lastGateTime: 0,   // for combo timeout
    popups: []         // {x,y,text,ttl}
  };

  const gates = {
    items: [],

    // tuning
    spacingMin: 260,
    spacingMax: 420,
    width: 46,      // half-width of gate opening
    height: 140,    // opening height
    marginAboveGround: 60,
    marginFromTop: 80,
    lookAhead: 2200,

    idCounter: 1
  };

  function rand(min, max) { return min + (max - min) * rng(); }

  function addPopup(x, y, text) {
    score.popups.push({ x, y, text, ttl: 0.9 });
  }

  function awardGatePoints(gate) {
    const now = performance.now() / 1000;
    const comboTimeout = 2.2; // seconds allowed between gates

    if (now - score.lastGateTime <= comboTimeout) {
      score.combo += 1;
    } else {
      score.combo = 1;
    }

    score.lastGateTime = now;
    score.mult = 1 + Math.min(1.5, (score.combo - 1) * 0.08); // caps at +150%

    const base = 100;
    const pts = Math.round(base * score.mult);
    score.points += pts;

    addPopup(gate.x, gate.yTop + gates.height * 0.5, `+${pts}  x${score.mult.toFixed(2)}`);
  }

  function spawnGateAtX(x) {
    // Gate is a vertical "window" you must fly through.
    // We'll place it relative to terrain, so it stays plausible.
    const ground = groundYAt(x);

    // Choose an opening center Y that is above ground but below top of screen area.
    // We'll bias around mid-height of the current camera view later; for now use terrain-based band.
    const minCenter = ground - (gates.marginAboveGround + gates.height * 0.5);
    const maxCenter = ground - (gates.marginAboveGround + gates.height * 0.5) - 220; // allow higher gates too

    // If maxCenter ends up above minCenter (terrain too high), just clamp to a safe spot
    let centerY = lerp(minCenter, maxCenter, rng());
    centerY = Math.min(minCenter, Math.max(120, centerY));

    const gate = {
      id: gates.idCounter++,
      x,
      yTop: centerY - gates.height * 0.5,
      passed: false
    };
    gates.items.push(gate);
  }

  function ensureGatesAhead() {
    const startX = plane.x;
    const endX = plane.x + gates.lookAhead;

    // Remove old gates behind camera/player
    const keepBehind = 400;
    gates.items = gates.items.filter(g => g.x > startX - keepBehind);

    // Spawn forward until we cover endX
    let lastX = gates.items.length ? gates.items[gates.items.length - 1].x : (plane.x + 220);
    while (lastX < endX) {
      lastX += rand(gates.spacingMin, gates.spacingMax);
      spawnGateAtX(lastX);
    }
  }

  function checkGatePass() {
    // Simple AABB check between plane point and gate window.
    // We'll treat plane as a point at its center for MVP.
    const px = plane.x;
    const py = plane.y;

    for (const g of gates.items) {
      if (g.passed) continue;

      // gate window rectangle:
      // x in [g.x - width, g.x + width], y in [g.yTop, g.yTop + height]
      if (px >= g.x - gates.width && px <= g.x + gates.width &&
          py >= g.yTop && py <= g.yTop + gates.height) {
        g.passed = true;
        awardGatePoints(g);
      }
    }
  }
  
  // ---------- Input ----------
  const keys = new Set();
  window.addEventListener("keydown", (e) => {
    keys.add(e.code);
    if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
    if (e.code === "KeyR") reset();
  });
  window.addEventListener("keyup", (e) => keys.delete(e.code));

  // ---------- Touch controls ----------
  const touchState = { throttle: false, pitchUp: false, pitchDown: false };

  const isTouch = window.matchMedia("(pointer: coarse)").matches || ("ontouchstart" in window);
  const touchUI = document.getElementById("touchUI");
  if (isTouch) touchUI.style.display = "block";

  function setTouch(action, on) { touchState[action] = on; }

  document.querySelectorAll("[data-touch]").forEach(btn => {
    const action = btn.getAttribute("data-touch");
    const start = (e) => { e.preventDefault(); setTouch(action, true); };
    const end   = (e) => { e.preventDefault(); setTouch(action, false); };
    btn.addEventListener("pointerdown", start);
    btn.addEventListener("pointerup", end);
    btn.addEventListener("pointercancel", end);
    btn.addEventListener("pointerleave", end);
  });

  // prevent page scroll while playing
  document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

  const input = {
    get throttleUp() { return keys.has("Space") || keys.has("ArrowRight") || touchState.throttle; },
    get pitchUp()    { return keys.has("ArrowUp") || keys.has("KeyW") || touchState.pitchUp; },
    get pitchDown()  { return keys.has("ArrowDown") || keys.has("KeyS") || touchState.pitchDown; },
  };

  // ---------- Plane ----------
  const plane = {
    x: 140,
    y: 260,
    vx: 0,
    vy: 0,

    angle: 0,
    angVel: 0,

    throttle: 0,

    // visuals
    w: 56,
    h: 18,

    // forces/tuning
    thrust: 3200,
    drag: 0.35,       // base linear drag
    idleDrag: 2.2,     // extra linear drag when not throttling (lets speed go to 0)
    quadDrag: 0.0012,  // high-speed damping

    lift: 0.8,
    maxLift: 9000,
    stallSpeed: 220,

    maxAoA: 0.75,        // AoA clamp (rad)
    inducedDrag: 0.00000018, // lift^2 induced drag (tiny!)

    // smoothing / control
    pitchRate: 2.4,
    angDamp: 8.0,
    throttleUpRate: 0.8,
    throttleDownRate: 1.2,

    liftSmooth: 18,
    liftMagSmoothed: 0,

    maxSpeed: 200, // requested cap
  };

  // ---------- Camera ----------
  const cam = {
    x: 0,
    y: 0,
    follow(dt) {
      const targetX = plane.x - W() * 0.30;
      const targetY = plane.y - H() * 0.55;
      const k = 6.0;
      this.x += (targetX - this.x) * (1 - Math.exp(-k * dt));
      this.y += (targetY - this.y) * (1 - Math.exp(-k * dt));
    }
  };

  function reset() {
    plane.x = 140;
    plane.y = 260;
    plane.vx = 0;
    plane.vy = 0;
    plane.angle = 0;
    plane.angVel = 0;
    plane.throttle = 0;
    plane.liftMagSmoothed = 0;
    cam.x = 0;
    cam.y = 0;

      score.points = 0;
    score.combo = 0;
    score.mult = 1;
    score.lastGateTime = 0;
    score.popups.length = 0;

    gates.items.length = 0;
    gates.idCounter = 1;
    ensureGatesAhead();  

    // Ensure terrain exists around start & ahead
    ensureTerrainToX(plane.x + 2000);
  }

  // ---------- Simulation ----------
  let last = performance.now();

  function step(now) {
    const dt = Math.min(1/30, (now - last) / 1000);
    last = now;

    update(dt);
    render();

    requestAnimationFrame(step);
  }

  function update(dt) {
    // Throttle ramp
    if (input.throttleUp) {
      plane.throttle = Math.min(1, plane.throttle + plane.throttleUpRate * dt);
    } else {
      plane.throttle = Math.max(0, plane.throttle - plane.throttleDownRate * dt);
    }

    // Pitch
    let pitchInput = 0;
    if (input.pitchUp) pitchInput -= 1;
    if (input.pitchDown) pitchInput += 1;

    const targetAngVel = pitchInput * plane.pitchRate;
    plane.angVel += (targetAngVel - plane.angVel) * (1 - Math.exp(-plane.angDamp * dt));
    plane.angle += plane.angVel * dt;

    // Gravity
    plane.vy += world.gravity * dt;

    // Ensure terrain ahead for collision + drawing
    ensureTerrainToX(plane.x + 2200);

    ensureGatesAhead();
    
    
    // Speed/directions
    const speed = Math.hypot(plane.vx, plane.vy);
    const fx = Math.cos(plane.angle);
    const fy = Math.sin(plane.angle);

    // Thrust (forward)
    plane.vx += fx * (plane.thrust * plane.throttle) * dt;
    plane.vy += fy * (plane.thrust * plane.throttle) * dt;

    // Lift
    if (speed > 1) {
      const velAngle = Math.atan2(plane.vy, plane.vx);
      let aoa = plane.angle - velAngle;
      aoa = Math.atan2(Math.sin(aoa), Math.cos(aoa));
      aoa = Math.max(-plane.maxAoA, Math.min(plane.maxAoA, aoa));

      const stallFactor = Math.min(1, speed / plane.stallSpeed);

      let liftMag = (speed * speed) * plane.lift * Math.sin(aoa) * stallFactor;
      liftMag = Math.max(-plane.maxLift, Math.min(plane.maxLift, liftMag));

      // Smooth lift to avoid high-speed jitter
      const a = 1 - Math.exp(-plane.liftSmooth * dt);
      plane.liftMagSmoothed += (liftMag - plane.liftMagSmoothed) * a;
      liftMag = plane.liftMagSmoothed;

      // Lift-induced drag (prevents infinite climb)
      const inducedMag = plane.inducedDrag * (liftMag * liftMag);
      plane.vx -= (plane.vx / speed) * inducedMag * dt;
      plane.vy -= (plane.vy / speed) * inducedMag * dt;

      // Apply lift perpendicular to velocity
      const nx = -plane.vy / speed;
      const ny =  plane.vx / speed;
      plane.vx += nx * liftMag * dt;
      plane.vy += ny * liftMag * dt;
    }

    // Linear drag
    plane.vx -= plane.vx * plane.drag * dt;
    plane.vy -= plane.vy * plane.drag * dt;

    // Extra damping off-throttle (lets speed go to 0)
    const idleFactor = 1 - plane.throttle;
    const extra = plane.idleDrag * idleFactor;
    plane.vx -= plane.vx * extra * dt;
    plane.vy -= plane.vy * extra * dt;

    // Quadratic drag (stability at higher speed)
    const speedNow = Math.hypot(plane.vx, plane.vy);
    const q = plane.quadDrag * speedNow;
    plane.vx -= plane.vx * q * dt;
    plane.vy -= plane.vy * q * dt;

    // Max speed clamp (requested)
    const s = Math.hypot(plane.vx, plane.vy);
    if (s > plane.maxSpeed) {
      const k = plane.maxSpeed / s;
      plane.vx *= k;
      plane.vy *= k;
    }

    // Snap tiny speeds to zero (prevents forever drift)
    if (Math.abs(plane.vx) < 0.5) plane.vx = 0;
    if (Math.abs(plane.vy) < 0.5) plane.vy = 0;

    // Integrate
    plane.x += plane.vx * dt;
    plane.y += plane.vy * dt;

    checkGatePass();
    
    // Collision vs terrain
    const groundY = groundYAt(plane.x);
    const planeBottom = plane.y + plane.h * 0.5;
    if (planeBottom >= groundY) {
      reset(); // instant reset for now
      return;
    }

    // Update popups
    for (const p of score.popups) p.ttl -= dt;
    score.popups = score.popups.filter(p => p.ttl > 0);
    
    cam.follow(dt);
  }

  // ---------- Rendering ----------
  function render() {
    ctx.clearRect(0, 0, W(), H());

    // World transform
    ctx.save();
    ctx.translate(-cam.x, -cam.y);

    // Visible window in world coords
    const x0 = cam.x - 200;
    const x1 = cam.x + W() + 200;

    // Draw terrain
    ctx.fillStyle = "rgba(255,255,255,0.10)";
    ctx.beginPath();

    // Start from bottom-left
    ctx.moveTo(x0, cam.y + H() + 800);

    // Trace ground line
    const step = 20;
    for (let x = x0; x <= x1; x += step) {
      ctx.lineTo(x, groundYAt(x));
    }

    // Close down to bottom-right
    ctx.lineTo(x1, cam.y + H() + 800);
    ctx.closePath();
    ctx.fill();

    // Runway line (flat part at start)
    ctx.strokeStyle = "rgba(255,255,255,0.25)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, terrain.baseY);
    ctx.lineTo(terrain.flatUntilX, terrain.baseY);
    ctx.stroke();

    // Gates
    for (const g of gates.items) {
      const x = g.x;

      // gate posts
      ctx.strokeStyle = g.passed ? "rgba(255,255,255,0.18)" : "rgba(255,255,255,0.55)";
      ctx.lineWidth = 3;

      ctx.beginPath();
      ctx.moveTo(x - gates.width, g.yTop);
      ctx.lineTo(x - gates.width, g.yTop + gates.height);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(x + gates.width, g.yTop);
      ctx.lineTo(x + gates.width, g.yTop + gates.height);
      ctx.stroke();

      // subtle top/bottom markers
      ctx.strokeStyle = g.passed ? "rgba(255,255,255,0.12)" : "rgba(255,255,255,0.25)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x - gates.width, g.yTop);
      ctx.lineTo(x + gates.width, g.yTop);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(x - gates.width, g.yTop + gates.height);
      ctx.lineTo(x + gates.width, g.yTop + gates.height);
      ctx.stroke();
    }
    
    // Plane
    ctx.save();
    ctx.translate(plane.x, plane.y);
    ctx.rotate(plane.angle);

    ctx.fillStyle = "rgba(255,255,255,0.90)";
    ctx.fillRect(-plane.w/2, -plane.h/2, plane.w, plane.h);

    // nose marker
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(plane.w/2 - 6, -plane.h/2, 6, plane.h);

    // tiny “thrust” hint
    if (plane.throttle > 0.05) {
      ctx.fillStyle = "rgba(255,180,80,0.85)";
      ctx.fillRect(-plane.w/2 - 14, -4, 14 * plane.throttle, 8);
    }

    ctx.restore(); // plane

        // Popups (world space)
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.font = "14px system-ui, -apple-system, Segoe UI, Roboto, Arial";
    for (const p of score.popups) {
      const rise = (1 - p.ttl / 0.9) * 24;
      ctx.fillText(p.text, p.x - 30, p.y - 18 - rise);
    }
    
    ctx.restore(); // world

    // HUD
    const speed = Math.hypot(plane.vx, plane.vy);
    const agl = Math.max(0, groundYAt(plane.x) - (plane.y + plane.h * 0.5));
    ctx.fillText(
      `Score: ${score.points}  |  Combo: ${score.combo}  |  Mult: x${score.mult.toFixed(2)}`,
      14, 62
    );

    
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.font = "14px system-ui, -apple-system, Segoe UI, Roboto, Arial";
    ctx.fillText(
      `Throttle: ${(plane.throttle*100).toFixed(0)}%  |  Speed: ${speed.toFixed(0)} px/s  |  AGL: ${agl.toFixed(0)} px  |  R = reset`,
      14, 22
    );
    ctx.fillText(`Desktop: Space throttle, ↑/↓ pitch   •   Mobile: Left throttle, Right pitch`, 14, 42);
  }

  reset();
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
